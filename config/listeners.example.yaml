# CLOUDFLARE INTEGRATION EXAMPLE
# ============================================
#
# If behind Cloudflare:
# 1. Set forward_ip: true
# 2. Set forward_ip_header: "CF-Connecting-IP"
# 3. Enable Cloudflare's "Always Use HTTPS"
# 4. Disable tls_config (Cloudflare handles TLS)
